version: 2
updates:
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
    target-branch: main
    # メジャーバージョンの更新を無視（現在の TargetFramework の互換性を維持するため）
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    cooldown:
      default-days: 7
    groups:
      microsoft:
        patterns:
          - "Microsoft.*"
      third-party:
        patterns:
          - "*"
        exclude-patterns:
          - "Microsoft.*"
